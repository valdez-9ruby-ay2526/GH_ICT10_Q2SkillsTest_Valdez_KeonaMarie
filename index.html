<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
    <title>Periodic Table Information Finder</title>
    <style>
    * {
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .card {
            background-color: #ffffff;
            width: 100%;
            max-width: 520px;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(216, 27, 96, 0.25);
        }

        .header {
            background-color: #e91e63;
            color: #ffffff;
            text-align: center;
            padding: 25px 20px;
        }

        .header h1 {
            margin: 0;
            font-size: 26px;
            font-weight: bold;
        }

        .header p {
            margin: 6px 0 0 0;
            font-size: 14px;
            opacity: 0.95;
        }

        .content {
            padding: 24px;
        }

        .instructions-box {
            background-color: #fff0f5;
            border: 1px solid #f8bbd0;
            border-radius: 10px;
            padding: 16px;
            font-size: 13px;
            color: #880e4f;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .instructions-box strong {
            color: #ad1457;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: bold;
            color: #4a4a4a;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .input-group input {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid #f8bbd0;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-group input:focus {
            border-color: #e91e63;
        }

        .btn-submit {
            width: 100%;
            background-color: #d81b60;
            color: #ffffff;
            border: none;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-submit:hover {
            background-color: #c2185b;
        }

        .result-section {
            margin-top: 24px;
        }

        .result-title {
            color: #d81b60;
            font-weight: bold;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 15px;
        }

        .result-card {
            background-color: #fff5f8;
            border-left: 4px solid #e91e63;
            border-radius: 6px;
            padding: 16px;
            font-size: 14px;
            line-height: 1.8;
            color: #333333;
        }

        .footer {
            text-align: center;
            padding: 12px;
            font-size: 12px;
            color: #ad1457;
            border-top: 1px solid #f8bbd0;
            background-color: #fff9fb;
        }
    </style>
</head>
<body>
    <div class="card">
    <div class="header">
        <h1>Non-Metal Elements</h1>
        <p>Periodic Table Information Finder</p>
    </div>

    <div class="content">
        <div class="instructions-box">
            <strong>Instructions:</strong><br>
            Enter the <strong>symbol</strong> of a non-metal element (Example: H, O, Cl, Ne, Xe).
        </div>

        <div class="input-group">
            <label for="symbol">🔍 Element Symbol</label>
            <input type="text" id="symbol" placeholder="Enter symbol (e.g., rn)">
        </div>

    <button class="btn-submit" id="check-btn" py-click="check_element">Check Element</button>

        <div class="result-section">
            <div class="result-title">➡️Result:</div>
            <div class="result-card" id="result">
                Enter a non-metal symbol above and click "Check Element".
            </div>
        </div>
    </div>

    <div class="footer">
        💻 Skills Test • 2nd Quarter • Undercovered
    </div>
</div>

<script type="py" src="main.py"></script>

</body>
</html>
